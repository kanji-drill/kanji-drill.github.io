name: テストして GitHub Pages に公開

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx biome check .
      - run: npm test
      - run: npm run simulate
      # 試作運用の間は「試作版」と表示する（出題は確認済みの語だけ）。試作運用が終わったら build に切り替える
      # 組織のサイト（kanji-drill.github.io）なので、URL の直下（/）で配信する
      - run: npm run build:pilot
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
